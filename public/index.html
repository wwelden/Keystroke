<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keystroke — a Markdown compiler in TypeScript</title>
    <meta name="description" content="Live playground for Keystroke, a hand-written Markdown lexer, parser, and HTML renderer written in TypeScript.">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <h1>Keystroke</h1>
            <p>A Markdown compiler written from scratch in TypeScript: lexer → parser → AST → HTML.</p>
        </div>
        <nav class="links">
            <select id="sample" aria-label="Load sample">
                <option value="">Load sample…</option>
                <option value="tour">Feature tour</option>
                <option value="math">Math</option>
                <option value="lists">Lists &amp; checklists</option>
            </select>
            <a href="https://github.com/wwelden/Keystroke" target="_blank" rel="noopener">GitHub ↗</a>
        </nav>
    </header>

    <main class="workspace">
        <section class="pane">
            <div class="pane-header">
                <span>Markdown</span>
                <span class="stats" id="stats"></span>
            </div>
            <textarea id="editor" spellcheck="false" aria-label="Markdown input"></textarea>
        </section>

        <section class="pane">
            <div class="pane-header tabs" role="tablist">
                <button class="tab active" data-view="preview" role="tab">Preview</button>
                <button class="tab" data-view="html" role="tab">HTML</button>
                <button class="tab" data-view="tokens" role="tab">Tokens</button>
                <button class="tab" data-view="ast" role="tab">AST</button>
            </div>
            <div class="view active" data-view="preview">
                <iframe id="preview" sandbox title="Rendered output"></iframe>
            </div>
            <pre class="view code" data-view="html" id="html-out"></pre>
            <div class="view code" data-view="tokens" id="tokens-out"></div>
            <pre class="view code" data-view="ast" id="ast-out"></pre>
        </section>
    </main>

    <footer class="site-footer">
        Everything runs in your browser — the same <code>Lexer</code>, <code>Parser</code>, and <code>Renderer</code> classes covered by the project's Jest suite.
    </footer>

    <script src="/js/keystroke.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
